app:
  replicas: 1
  image: registry.gitlab.com/younesyousfipro-group/olympic-tracker
  # Empty = appVersion from Chart.yaml
  tag: ""
  # Always for a moving tag (main): IfNotPresent would keep the first image pulled
  imagePullPolicy: IfNotPresent
  # nginx listens on 8080 since the non-root image
  port: 8080
  # Created with kubectl in each namespace; empty = no imagePullSecrets block
  imagePullSecret: olympic-tracker-registry
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 64Mi
