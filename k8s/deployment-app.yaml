apiVersion: apps/v1
kind: Deployment
metadata:
  name: olympic-games-app-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: olympic-games-app
  template:
    metadata:
      labels:
        app: olympic-games-app
    spec:
      containers:
      - name: olympic-games-app
        image: registry.gitlab.com/younesyousfipro-group/olympic-tracker:0.1.4
        ports:
        # nginx listens on 8080 since the non-root image (see docs/decisions.md)
        - containerPort: 8080
      # Created with kubectl from a read_registry deploy token, never committed
      imagePullSecrets:
      - name: olympic-tracker-registry
